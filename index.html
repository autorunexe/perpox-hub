<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PerPox Overlay</title>
  <style>
    @font-face {
      font-family: 'Mortend';
      src: url('src/Mortend-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    :root {
      --glow: #ffa800;
      --yellow: #ffc000;
      --box: #0f0f0f;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    .canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 260px;
      overflow: hidden;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 260px;
      overflow: visible;
      isolation: isolate;
    }

    /* Clean template base box without any background noise */
    .template-box {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 260px;
      background: url("src/template-clean.png") center / 100% 100% no-repeat;
      pointer-events: none;
      z-index: 1;
    }

    /* Cyber orange slashes with running light pulse animation */
    .slashes-glow-wrap {
      position: absolute;
      left: 198px;
      top: 117px;
      width: 117px;
      height: 8px;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
      -webkit-mask: url("src/slashes-strip.png") 0 0 / 117px 8px no-repeat;
      mask: url("src/slashes-strip.png") 0 0 / 117px 8px no-repeat;
    }

    .slashes-light-runner {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 230, 140, 0.4) 20%,
        #ffffff 50%,
        rgba(255, 230, 140, 0.4) 80%,
        transparent 100%
      );
      width: 80px;
      height: 100%;
      animation: run-slashes-light 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      mix-blend-mode: overlay;
    }

    .slashes-pulse-glow {
      position: absolute;
      left: 198px;
      top: 117px;
      width: 117px;
      height: 8px;
      pointer-events: none;
      z-index: 2;
      background: url("src/slashes-strip.png") 0 0 / 117px 8px no-repeat;
      filter: drop-shadow(0 0 4px #ffa800) drop-shadow(0 0 10px rgba(255, 168, 0, 0.8));
      animation: slashes-pulse 2.2s ease-in-out infinite;
    }

    @keyframes run-slashes-light {
      0% {
        transform: translateX(-90px);
      }
      55%, 100% {
        transform: translateX(130px);
      }
    }

    @keyframes slashes-pulse {
      0%, 100% {
        opacity: 0.7;
        filter: drop-shadow(0 0 3px #ffa800) drop-shadow(0 0 6px rgba(255, 168, 0, 0.5));
      }
      35% {
        opacity: 1;
        filter: drop-shadow(0 0 7px #ffcc00) drop-shadow(0 0 14px rgba(255, 168, 0, 0.95)) drop-shadow(0 0 20px #ffa800);
      }
    }

    /* Clean subtle aura behind logo (smooth, pure vector gradient, 0 noise) */
    .logo-aura {
      position: absolute;
      left: 86px;
      top: 96px;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle closest-side, rgba(255, 168, 0, 0.28) 0%, rgba(255, 168, 0, 0.12) 50%, transparent 100%);
      filter: blur(16px);
      pointer-events: none;
      z-index: 2;
    }

    /* 3D stage for PerPox logo with perfectly un-squashed, un-distorted aspect ratio */
    .logo-stage {
      position: absolute;
      left: 9px;
      top: 15px;
      width: 156px;
      height: 162px;
      perspective: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .logo-rotor {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: rotate-3d 6.5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .logo-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      backface-visibility: visible;
    }

    .logo-front {
      transform: translateZ(2px);
      filter: drop-shadow(0 0 8px rgba(255, 168, 0, 0.85)) drop-shadow(0 0 16px rgba(255, 168, 0, 0.5));
    }

    .logo-back {
      transform: translateZ(-2px) rotateY(180deg);
      filter: drop-shadow(0 0 6px rgba(255, 168, 0, 0.45)) brightness(0.92);
    }

    .logo-glitch {
      opacity: 0;
      filter: drop-shadow(0 0 12px #ffa800) brightness(1.3);
      pointer-events: none;
      z-index: 5;
    }
    /* Headline text area: 498px wide in contoh.png (561 to 1059) */
    .headline-wrap {
      position: absolute;
      left: 561px;
      top: 126px;
      width: 498px;
      height: 18px;
      display: flex;
      align-items: center;
      z-index: 4;
    }

    .headline {
      position: relative;
      font-family: 'Mortend', sans-serif;
      font-weight: 700;
      font-size: 26.5px;
      line-height: 1;
      letter-spacing: 0.093em;
      color: var(--yellow);
      white-space: nowrap;
      text-transform: uppercase;
      will-change: transform, opacity;
    }

    .headline::before,
    .headline::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    .headline::before {
      color: #ffe6a0;
      clip-path: polygon(0 0, 100% 0, 100% 48%, 0 48%);
    }

    .headline::after {
      color: #ff9000;
      clip-path: polygon(0 52%, 100% 52%, 100% 100%, 0 100%);
    }

    /* Social badges (YouTube & TikTok) */
    .social-bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .social-badge-yt {
      position: absolute;
      left: 256px;
      top: 224px;
      width: 143px;
      height: 24px;
      object-fit: fill;
    }

    .social-badge-tt {
      position: absolute;
      left: 749px;
      top: 222px;
      width: 152px;
      height: 26px;
      object-fit: fill;
    }

    @keyframes rotate-3d {
      0% { transform: rotateY(0deg) rotateX(2deg); }
      45% { transform: rotateY(180deg) rotateX(-2deg); }
      50% { transform: rotateY(180deg) rotateX(-2deg); }
      95% { transform: rotateY(360deg) rotateX(2deg); }
      100% { transform: rotateY(360deg) rotateX(2deg); }
    }

    @keyframes logo-glitch-anim {
      0%, 82%, 100% {
        opacity: 0;
        transform: translate(0, 0);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      83% {
        opacity: 0.9;
        transform: translate(-4px, 2px) skewX(-4deg);
        clip-path: polygon(0 15%, 100% 15%, 100% 32%, 0 32%, 0 55%, 100% 55%, 100% 72%, 0 72%);
      }
      85% {
        opacity: 0.8;
        transform: translate(4px, -2px) skewX(5deg);
        clip-path: polygon(0 25%, 100% 25%, 100% 45%, 0 45%, 0 70%, 100% 70%, 100% 88%, 0 88%);
      }
      87% {
        opacity: 0.95;
        transform: translate(-3px, 1px);
        clip-path: polygon(0 8%, 100% 8%, 100% 22%, 0 22%, 0 40%, 100% 40%, 100% 60%, 0 60%);
      }
      89% {
        opacity: 0;
        transform: translate(0, 0);
      }
    }

    .logo-glitch {
      animation: logo-glitch-anim 4.6s steps(2, end) infinite;
    }

    .glitching .headline {
      animation: headline-glitch 0.4s steps(2, end);
    }
    .glitching .headline::before {
      opacity: 0.9;
      animation: glitch-slice-1 0.4s steps(2, end);
    }
    .glitching .headline::after {
      opacity: 0.9;
      animation: glitch-slice-2 0.4s steps(2, end);
    }

    @keyframes headline-glitch {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1px) skewX(-3deg); }
      40% { transform: translate(3px, -1px) skewX(2deg); }
      60% { transform: translate(-2px, 0); }
      80% { transform: translate(1px, -1px); }
    }

    @keyframes glitch-slice-1 {
      0%, 100% { transform: translate(0, 0); opacity: 0; }
      25% { transform: translate(-4px, -1px); opacity: 0.9; }
      50% { transform: translate(5px, 1px); opacity: 0.85; }
      75% { transform: translate(-2px, 0); opacity: 0.9; }
    }

    @keyframes glitch-slice-2 {
      0%, 100% { transform: translate(0, 0); opacity: 0; }
      25% { transform: translate(4px, 1px); opacity: 0.9; }
      50% { transform: translate(-5px, -1px); opacity: 0.85; }
      75% { transform: translate(3px, 0); opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-rotor { animation: none; }
      .logo-glitch { display: none; }
      .glitching .headline { animation: none; }
      .glitching .headline::before, .glitching .headline::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="canvas" aria-label="PerPox stream overlay">
    <div class="overlay" aria-label="Overlay PerPox">
      <!-- Clean Dark polygonal base box -->
      <div class="template-box" aria-hidden="true"></div>

      <!-- Animated Glow & Running Light on the Orange Slashes -->
      <div class="slashes-pulse-glow" aria-hidden="true"></div>
      <div class="slashes-glow-wrap" aria-hidden="true">
        <div class="slashes-light-runner"></div>
      </div>

      <!-- Clean Soft Aura Behind PerPox Logo (No Noise) -->
      <div class="logo-aura" aria-hidden="true"></div>

      <!-- 3D Rotating & Glitching PerPox Logo (Exact Aspect Ratio) -->
      <div class="logo-stage" aria-hidden="true">
        <div class="logo-rotor">
          <img class="logo-layer logo-back" src="src/perpox-cropped.png" alt="">
          <img class="logo-layer logo-front" src="src/perpox-cropped.png" alt="">
          <img class="logo-layer logo-glitch" src="src/perpox-cropped.png" alt="">
        </div>
      </div>

      <!-- Alternating Headline -->
      <div class="headline-wrap">
        <div class="headline" id="headline" data-text="DONATE SAWERIA ON BIO">DONATE SAWERIA ON BIO</div>
      </div>

      <!-- Social Row: YouTube & TikTok (100% Pixel-Accurate Badges directly from contoh.png) -->
      <div class="social-bar">
        <img class="social-badge-yt" src="src/youtube-badge.png" alt="YouTube: PERPOX" aria-label="YouTube: PERPOX">
        <img class="social-badge-tt" src="src/tiktok-badge.png" alt="TikTok: PERPOX" aria-label="TikTok: PERPOX">
      </div>
    </div>
  </div>

  <script>
    const messages = ['DONATE SAWERIA ON BIO', 'MEDIA SHARE ON BIO'];
    const headline = document.getElementById('headline');
    const headlineWrap = document.querySelector('.headline-wrap');
    let currentIdx = 0;
    let glitchTimeout;

    function switchHeadline() {
      currentIdx = (currentIdx + 1) % messages.length;
      const nextText = messages[currentIdx];

      headlineWrap.classList.remove('glitching');
      void headlineWrap.offsetWidth;
      headline.textContent = nextText;
      headline.dataset.text = nextText;
      headlineWrap.classList.add('glitching');

      clearTimeout(glitchTimeout);
      glitchTimeout = setTimeout(() => {
        headlineWrap.classList.remove('glitching');
      }, 420);
    }

    setInterval(switchHeadline, 4600);
  </script>
</body>
</html>
